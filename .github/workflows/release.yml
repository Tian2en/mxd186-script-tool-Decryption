name: Build & Release

# 打 tag（如 v1.0.0）时自动构建 exe 并创建 Release
# 注意：仓库中不存放 exe，构建产物通过 Release 附件分发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Node runtime
        run: python build/fetch_node.py

      - name: Build exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name "MXD186脚本工具" `
            --add-data "$env:GITHUB_WORKSPACE\node.exe;." `
            --add-data "$env:GITHUB_WORKSPACE\assets\deob_bundle.js;." `
            --collect-all tkinterdnd2 `
            --distpath "$env:GITHUB_WORKSPACE\dist" `
            --workpath "$env:GITHUB_WORKSPACE\build\pyinstaller" `
            --specpath "$env:GITHUB_WORKSPACE\build" `
            "$env:GITHUB_WORKSPACE\src\app.py"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXD186脚本工具
          path: dist/MXD186脚本工具.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MXD186脚本工具.exe
          generate_release_notes: true
          body: |
            ### MXD186 脚本解密 / 去混淆工具

            单文件 exe，双击即用。详见 [README](README.md)。

            > 仅供学习研究使用，请勿用于侵犯他人权益的用途。
