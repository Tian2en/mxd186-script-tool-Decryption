name: Build & Release

# 打 tag（如 v1.3.0）时自动构建 exe 并创建 Release
# 也支持在 Actions 页面手动触发（仅构建并上传 artifact，不创建 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 直接用 runner 自带的 Node，比自行下载稳定得多
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare node.exe
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          Write-Host "node 路径: $node"
          Copy-Item $node "$env:GITHUB_WORKSPACE\node.exe" -Force
          & "$env:GITHUB_WORKSPACE\node.exe" --version

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify resources
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/deob_bundle.js")) { throw "缺少 assets/deob_bundle.js" }
          if (-not (Test-Path "node.exe")) { throw "缺少 node.exe" }
          Write-Host "deob_bundle.js: $((Get-Item 'assets/deob_bundle.js').Length) 字节"
          Write-Host "node.exe: $((Get-Item 'node.exe').Length) 字节"

      - name: Build exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name "MXD186脚本工具" `
            --add-data "$env:GITHUB_WORKSPACE\node.exe;." `
            --add-data "$env:GITHUB_WORKSPACE\assets\deob_bundle.js;." `
            --collect-all tkinterdnd2 `
            --distpath "$env:GITHUB_WORKSPACE\dist" `
            --workpath "$env:GITHUB_WORKSPACE\build\pyinstaller" `
            --specpath "$env:GITHUB_WORKSPACE\build" `
            "$env:GITHUB_WORKSPACE\src\app.py"

      - name: Smoke test exe
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\dist\MXD186脚本工具.exe"
          if (-not (Test-Path $exe)) { throw "exe 未生成" }
          $size = (Get-Item $exe).Length
          Write-Host "exe 大小: $size 字节"
          if ($size -lt 20MB) { throw "exe 体积异常，可能缺少内置资源" }
          # exe 是 GUI 子系统程序：PowerShell 的 & 不会等待它，$LASTEXITCODE 取不到值，
          # 必须用 Start-Process -Wait -PassThru 才能拿到退出码。
          # --cli 参数不足时应返回 2，能正常返回说明程序可以启动。
          $p = Start-Process -FilePath $exe -ArgumentList '--cli' -Wait -PassThru
          Write-Host "自检退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 2) { throw "exe 自检失败，退出码 $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXD186脚本工具
          path: dist/MXD186脚本工具.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MXD186脚本工具.exe
          generate_release_notes: true
          body: |
            ### MXD186 脚本解密 / 去混淆工具

            单文件 exe，双击即用。详见 [README](README.md)。

            > 仅供学习研究使用，请勿用于侵犯他人权益的用途。
